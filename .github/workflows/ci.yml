name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: go build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odooclaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: odooclaw/go.mod
          cache-dependency-path: odooclaw/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s
