name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: go build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odooclaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: odooclaw/go.mod
          cache-dependency-path: odooclaw/go.sum

      - name: Build, Vet and Test
        run: make build vet test

  pytest-odoo-mcp:
    name: pytest odoo-mcp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [workspace, onboard]
    defaults:
      run:
        working-directory: odooclaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (tesseract, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install pytest
        run: pip install --no-cache-dir pytest

      - name: Install odoo-mcp workspace deps
        working-directory: odooclaw/workspace/skills/odoo-mcp
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install odoo-mcp onboard deps
        working-directory: odooclaw/cmd/odooclaw/internal/onboard/workspace/skills/odoo-mcp
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run workspace tests
        working-directory: odooclaw/workspace/skills/odoo-mcp
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: Run onboard tests
        working-directory: odooclaw/cmd/odooclaw/internal/onboard/workspace/skills/odoo-mcp
        run: PYTHONPATH=src python3 -m pytest tests/ -q

  workspace-divergence:
    name: workspace divergence check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odooclaw
    steps:
      - uses: actions/checkout@v4

      - name: Generate embedded workspace
        run: make generate

      - name: Check source and embedded trees match
        run: diff -rq ../workspace cmd/odooclaw/internal/onboard/workspace
