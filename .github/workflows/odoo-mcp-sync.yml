# CI: Verify the derived odoo-mcp repo matches the canonical embedded copy.
# FAILS if any source file diverges or if files exist in only one side.
#
# Direction (see odooclaw/workspace/skills/odoo-mcp/SYNC_POLICY.md):
#   CANONICAL — odooclaw/workspace/skills/odoo-mcp/ in this repo (edited here).
#   DERIVED   — nicolasramos/odooclaw-mcp (regenerated by scripts/sync-odoo-mcp.sh).
#
# Both sides are compared over the SAME set: {src/**, tests/**, requirements.txt}
# minus the 11 entry-point exceptions of the derived package (pyproject.toml
# points its four console aliases at odoo_mcp.cli:main). Those files live only in
# the derived repo and are neither compared nor deleted, so they are filtered out
# of both lists here exactly as in the sync script.

name: "odoo-mcp sync check"

on:
  push:
    paths:
      - "odooclaw/workspace/skills/odoo-mcp/**"
      - ".github/workflows/odoo-mcp-sync.yml"
  pull_request:
    paths:
      - "odooclaw/workspace/skills/odoo-mcp/**"
      - ".github/workflows/odoo-mcp-sync.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-sync:
    name: "Verify derived repo matches canonical embedded copy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout odooclaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout derived odoo-mcp repo
        uses: actions/checkout@v4
        with:
          repository: nicolasramos/odooclaw-mcp
          path: .derived-odoo-mcp
          fetch-depth: 1

      - name: Compare canonical vs derived (same set on both sides)
        run: |
          set -euo pipefail

          CANONICAL="odooclaw/workspace/skills/odoo-mcp"
          DERIVED=".derived-odoo-mcp"

          # Entry points of the derived package — same list as
          # scripts/sync-odoo-mcp.sh.
          EXCEPTIONS=(
            src/odoo_mcp/__init__.py
            src/odoo_mcp/__main__.py
            src/odoo_mcp/cli.py
            src/odoo_mcp/healthcheck.py
            src/odoo_mcp/core/__init__.py
            src/odoo_mcp/observability/__init__.py
            src/odoo_mcp/schemas/__init__.py
            src/odoo_mcp/security/__init__.py
            src/odoo_mcp/services/__init__.py
            src/odoo_mcp/tools/__init__.py
            tests/__init__.py
          )
          printf '%s\n' "${EXCEPTIONS[@]}" | sort > /tmp/odoo-mcp-exceptions

          # Compared set of a tree: {src, tests, requirements.txt} minus the
          # exceptions. Identical filter on both sides; both lists stay sorted,
          # which is what comm requires.
          list_set() {
            (cd "$1" && find src tests requirements.txt -type f 2>/dev/null | sort) \
              | awk 'NR==FNR{e[$0]=1;next} !($0 in e)' /tmp/odoo-mcp-exceptions -
          }

          list_set "$CANONICAL" > /tmp/odoo-mcp-canonical-files
          list_set "$DERIVED" > /tmp/odoo-mcp-derived-files

          # --- Shared files: check for content differences ---
          comm -12 /tmp/odoo-mcp-canonical-files /tmp/odoo-mcp-derived-files | while read -r relpath; do
            [ -n "$relpath" ] || continue
            if ! diff -q "$CANONICAL/$relpath" "$DERIVED/$relpath" > /dev/null 2>&1; then
              echo "DIFFER: $relpath"
            fi
          done > /tmp/odoo-mcp-shared-diffs

          # --- Canonical-only files (not in the derived repo) ---
          comm -23 /tmp/odoo-mcp-canonical-files /tmp/odoo-mcp-derived-files > /tmp/odoo-mcp-canonical-only

          # --- Derived-only files (not in the canonical copy) ---
          comm -13 /tmp/odoo-mcp-canonical-files /tmp/odoo-mcp-derived-files > /tmp/odoo-mcp-derived-only

          # --- Count and report ---
          SHARED_DIFF=$(wc -l < /tmp/odoo-mcp-shared-diffs | tr -d ' ')
          CANONICAL_ONLY=$(wc -l < /tmp/odoo-mcp-canonical-only | tr -d ' ')
          DERIVED_ONLY=$(wc -l < /tmp/odoo-mcp-derived-only | tr -d ' ')

          echo "Compared set (canonical):      $(wc -l < /tmp/odoo-mcp-canonical-files | tr -d ' ')"
          echo "Compared set (derived):        $(wc -l < /tmp/odoo-mcp-derived-files | tr -d ' ')"
          echo "Shared files with differences: $SHARED_DIFF"
          echo "Files only in canonical copy:  $CANONICAL_ONLY"
          echo "Files only in derived repo:    $DERIVED_ONLY"

          if [ "$SHARED_DIFF" -gt 0 ]; then
            echo "::error::Content divergence detected in shared files:"
            sed 's/^/  /' /tmp/odoo-mcp-shared-diffs
          fi

          if [ "$CANONICAL_ONLY" -gt 0 ]; then
            echo "::error::Source files exist only in the canonical copy (not propagated):"
            sed 's/^/  /' /tmp/odoo-mcp-canonical-only
          fi

          if [ "$DERIVED_ONLY" -gt 0 ]; then
            echo "::error::Source files exist only in the derived repo (stale leftovers):"
            sed 's/^/  /' /tmp/odoo-mcp-derived-only
          fi

          TOTAL_ISSUES=$((SHARED_DIFF + CANONICAL_ONLY + DERIVED_ONLY))
          if [ "$TOTAL_ISSUES" -gt 0 ]; then
            echo "::error::Copies diverge. Run ./scripts/sync-odoo-mcp.sh to regenerate."
            exit 1
          fi

          echo "OK: derived repo matches the canonical embedded copy."
